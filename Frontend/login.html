
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Siruwa Store</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">

            <a href="Beranda.html" class="logo">
                Siruwa<span>.</span>
            </a>

            <h1>Selamat Datang!</h1>

            <p class="description">
                Silakan login untuk melanjutkan belanja
                oleh-oleh khas Minang.
            </p>

            <form id="loginForm"
                 action="../Backend/auth/login.php"
                  method="POST">

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Masukkan email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan password"
                        required
                    >
                </div>

                <button type="submit" class="auth-btn">
                    Login
                </button>

            </form>

            <p class="register-text">
                Belum punya akun?
                <a href="register.html">Daftar sekarang</a>
            </p>

            <a href="Beranda.html" class="back-link">
                ← Kembali ke Beranda
            </a>

        </div>
    </div>

</body>
</html>
