
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Siruwa Store</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">

            <a href="Beranda.html" class="logo">
                Siruwa<span>.</span>
            </a>

            <h1>Buat Akun Baru</h1>

            <p class="description">
                Daftar sekarang dan nikmati berbagai
                oleh-oleh khas Minangkabau.
            </p>

            <form id="registerForm"
                 action="../Backend/auth/register.php"
                  method="POST">

                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text"
                        id="nama"
                        name="nama"
                        placeholder="Masukkan nama lengkap"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email"
                        id="email"
                        name="email"
                        placeholder="Masukkan email"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password"
                        id="password"
                        name="password"
                        placeholder="Minimal 8 karakter"
                        minlength="8"
                        required>
                    
                </div>

<div class="form-group">
    <label for="confirmPassword">Konfirmasi Password</label>
    <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        placeholder="Ulangi password"
        minlength="8"
        required
    >
</div>

                <div class="form-group">
                    <label for="confirmPassword">Konfirmasi Password</label>
                    <input type="password"
                        id="confirmPassword"
                        placeholder="Ulangi password"
                        minlength="8"
                        required>
                </div>

                <button type="submit" class="auth-btn">
                    Daftar Sekarang
                </button>

            </form>

            <p class="register-text">
                Sudah punya akun?
                <a href="login.html">Login sekarang</a>
            </p>

            <a href="Beranda.html" class="back-link">
                ← Kembali ke Beranda
            </a>

        </div>
    </div>

    <script>
        const form = document.getElementById("registerForm");

        form.addEventListener("submit", function(event) {
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                event.preventDefault();
                alert("Konfirmasi password tidak sama!");
            }
        });
    </script>

</body>
</html>
